name: Publish Helm chart

on:
  push:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/helm-publish.yml"
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  publish-oci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        run: helm package helm --destination /tmp/helm-pkg

      - name: Push chart
        run: helm push /tmp/helm-pkg/*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
